# AM Consulting LLC website + AMCMS — self-hosted stack for a single Linux server
# (e.g. a DigitalOcean Droplet). See docs/12-DEPLOY_DIGITALOCEAN.md.
#
#   cp .env.example .env   # fill in the values
#   docker compose up -d --build
#
# Services: PostgreSQL 16 (private network only), the Node app, Caddy (HTTPS via Let's Encrypt),
# and a tiny scheduler that runs the daily maintenance job and nightly database backups.
name: amcms

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_SUPERUSER_PASSWORD:?set POSTGRES_SUPERUSER_PASSWORD in .env}
      POSTGRES_DB: postgres
      APP_DB_USER: amcms
      APP_DB_NAME: amcms
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:?set APP_DB_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/platform/roles.sql:/amcms/roles.sql:ro
      - ./deploy/postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d amcms"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks: [backend]
    # No "ports:" — the database is never exposed to the internet.

  app:
    build:
      context: .
      args:
        VITE_PUBLIC_SITE_URL: ${PUBLIC_SITE_URL:-}
        VITE_TURNSTILE_SITE_KEY: ${VITE_TURNSTILE_SITE_KEY:-}
    image: amcms-app:latest
    init: true
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://amcms:${APP_DB_PASSWORD}@db:5432/amcms
      AUTH_SECRET: ${AUTH_SECRET:?set AUTH_SECRET in .env}
      IP_HASH_SALT: ${IP_HASH_SALT:?set IP_HASH_SALT in .env}
      CRON_SECRET: ${CRON_SECRET:?set CRON_SECRET in .env}
      PUBLIC_SITE_URL: ${PUBLIC_SITE_URL:?set PUBLIC_SITE_URL in .env}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      LEAD_RECIPIENT_EMAIL: ${LEAD_RECIPIENT_EMAIL:-}
      LEAD_FROM_EMAIL: ${LEAD_FROM_EMAIL:-}
      TURNSTILE_SECRET_KEY: ${TURNSTILE_SECRET_KEY:-}
      AMCMS_REQUIRE_MFA: "true"
      STORAGE_DIR: /data/storage
    volumes:
      - storage:/data/storage
    networks: [backend, web]
    # Reached only through Caddy; not published on the host.

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on: [app]
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      DOMAIN: ${DOMAIN:?set DOMAIN in .env}
      ACME_EMAIL: ${ACME_EMAIL:?set ACME_EMAIL in .env}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks: [web]

  scheduler:
    image: postgres:16-alpine
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      CRON_SECRET: ${CRON_SECRET}
      PGHOST: db
      PGUSER: amcms
      PGPASSWORD: ${APP_DB_PASSWORD}
      PGDATABASE: amcms
      BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:-14}
    volumes:
      - ./deploy/scheduler.sh:/scheduler.sh:ro
      - ./backups:/backups
      - storage:/data/storage:ro
    entrypoint: ["/bin/sh", "/scheduler.sh"]
    networks: [backend]

volumes:
  pgdata:
  storage:
  caddy_data:
  caddy_config:

networks:
  backend:
    internal: true
  web:
